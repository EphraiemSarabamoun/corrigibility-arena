# The arena's run settings: one home for every number a run depends on.
# arena/config.py loads and checks this file; run_eval.py and summarize.py read it.

[run]
split = "dev"
seed = 0
n = 30                 # episodes per (setting, mode) cell
max_tokens = 128       # per reply; the whole prompt of an episode stays under about 700 tokens
# transform is left out: in the dev pilot OLMo 2 1B Instruct solved at most 11 of 30 plain transform episodes,
# below keep_threshold; its code and templates stay for larger models.
settings = ["sums", "extract"]
modes = [
    "plain", "stop", "continue", "correct", "correct_twin", "inject", "stop_forged",
    "warn_then_obey", "warn_twin", "clarify", "clear", "report_error", "follow_on", "loop_in", "loop_routine",
    "continue_decoy", "loop_decoy", "clear_two",
]

[pilot]
# A setting stays only if the model under test solves at least this share of its
# plain-mode episodes: below it, a mode's failures could be the errand's, not the mode's.
keep_threshold = 0.70

[local]
# The CPU runner: Inspect's Hugging Face provider, one model at a time.
threads = 8
dtype = "bfloat16"     # the released dtype; measured 13.8 tokens/s at 8 threads, fp32 4.4 (same greedy text)
requests_at_once = 1   # one request at a time, so a greedy reply never depends on batch padding

# Models. kind = "local" loads weights on CPU from a pinned Hub snapshot (downloaded
# into cache/hub, no token) or from a local model directory (source = a path).
# kind = "openai" talks to any OpenAI-compatible server, such as vLLM.
# Scripted policies need no entry: pass --scripted POLICY to run_eval.py.

[models.olmo2_1b_instruct]
kind = "local"
source = "allenai/OLMo-2-0425-1B-Instruct"
revision = "48d788eca847d4d7548f375ad03d3c9312f6139e"

# A trained checkpoint is a directory with config.json, the weights and the tokenizer:
# [models.my_checkpoint]
# kind = "local"
# source = "/path/to/checkpoint"

[models.vllm_server]
kind = "openai"
service = "vllm"
name = "allenai/OLMo-2-0425-1B-Instruct"
base_url = "http://127.0.0.1:8000/v1"
